name: ENS Submission Analysis

on:
  push:
    branches: [main]
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/analysis.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository URL to analyze'
        required: true
        default: 'https://github.com/immunefi-team/audit-comp-ens.git'
      stages:
        description: 'Pipeline stages to request'
        required: true
        default: 'sast,symbolic,fuzz,deps,secrets,ui,rpc,diff,known-filter,report'
      assets:
        description: 'Configured audit assets or all'
        required: true
        default: 'all'
      publish:
        description: 'Persist validated staging output to the reports branch'
        type: boolean
        required: true
        default: true
      final_audit:
        description: 'Install and require the full external analyzer toolchain'
        type: boolean
        required: true
        default: false
      accept_codeql_terms:
        description: 'Confirm CodeQL CLI terms have been reviewed and accepted for this run'
        type: boolean
        required: true
        default: false
      require_snyk:
        description: 'Require Snyk CLI and SNYK_TOKEN for the final run'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: ens-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  QT_QPA_PLATFORM: offscreen
  DEFAULT_STAGES: 'sast,symbolic,fuzz,deps,secrets,ui,rpc,diff,known-filter,report'

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ens-audit-runner/requirements.txt

      - name: Install runtime requirements
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 ca-certificates curl jq unzip tar gzip build-essential z3 git
          python -m pip install --upgrade pip
          python -m pip install -e './ens-audit-runner[dev]'

      - name: Verify engine wiring
        working-directory: ens-audit-runner
        run: |
          pytest -q \
            tests/test_stage_sast.py \
            tests/test_stage_symbolic.py \
            tests/test_stage_fuzz.py \
            tests/test_stage_deps.py \
            tests/test_stage_secrets.py \
            tests/test_stage_report.py \
            tests/test_pipeline.py

      - name: Prepare output
        run: mkdir -p "$GITHUB_WORKSPACE/out/runs"

      - name: Validate pipeline scripts
        run: |
          bash -n .github/scripts/install-final-audit-tools.sh
          bash -n .github/scripts/verify-final-audit-tools.sh
          bash -n .github/scripts/generate-pocs.sh
          bash -n .github/scripts/stage-output.sh
          bash -n .github/scripts/verify-submissions.sh

      - name: Install external analyzer toolchain
        env:
          ACCEPT_CODEQL_TERMS: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_codeql_terms }}
          GITHUB_TOKEN: ${{ github.token }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: bash .github/scripts/install-final-audit-tools.sh

      - name: Verify final-audit analyzer toolchain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.final_audit }}
        env:
          STRICT_TOOLCHAIN: '1'
          REQUIRE_SNYK: ${{ inputs.require_snyk }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: bash .github/scripts/verify-final-audit-tools.sh

      - name: Snapshot available analyzer toolchain
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.final_audit != true }}
        env:
          STRICT_TOOLCHAIN: '0'
          REQUIRE_SNYK: 'false'
        run: bash .github/scripts/verify-final-audit-tools.sh

      - name: Run analysis
        env:
          TARGET_REPO: ${{ inputs.repo || 'https://github.com/immunefi-team/audit-comp-ens.git' }}
          TARGET_ASSETS: ${{ inputs.assets || 'all' }}
          TARGET_STAGES: ${{ inputs.stages || env.DEFAULT_STAGES }}
          AUDIT_STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.final_audit }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: ens-audit-runner
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/out/runs/analysis.log"
          import asyncio
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          from ens_audit.config import ASSETS, UPSTREAM_REPOSITORY
          from ens_audit.known_issues import load_known_issues
          from ens_audit.pipeline.orchestrator import PipelineOrchestrator

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          out = workspace / "out"
          out.mkdir(parents=True, exist_ok=True)

          requested_repo = os.environ["TARGET_REPO"].strip()
          if requested_repo != UPSTREAM_REPOSITORY:
              raise SystemExit(
                  f"workflow repo mismatch: requested={requested_repo!r} configured={UPSTREAM_REPOSITORY!r}"
              )

          configured_assets = {spec.name for spec in ASSETS}
          asset_tokens = {
              value.strip() for value in os.environ["TARGET_ASSETS"].split(",") if value.strip()
          }
          if asset_tokens == {"all"}:
              requested_assets = configured_assets
          else:
              aliases = {"portal": "explorer"}
              requested_assets = {aliases.get(value, value) for value in asset_tokens}
          if requested_assets != configured_assets:
              raise SystemExit(
                  "current runner executes its fixed configured asset set; "
                  f"requested={sorted(requested_assets)} configured={sorted(configured_assets)}"
              )

          requested_stages = [
              value.strip().lower().replace("-", "_")
              for value in os.environ["TARGET_STAGES"].split(",")
              if value.strip()
          ]
          available = set(PipelineOrchestrator.ANALYSIS_STAGES) | {"known_filter", "report"}
          unavailable = [stage for stage in requested_stages if stage not in available]
          for stage in unavailable:
              print(
                  f"::warning::stage '{stage}' has no analyzer implementation in the current runner; skipping"
              )

          selected = [
              stage for stage in PipelineOrchestrator.ANALYSIS_STAGES if stage in requested_stages
          ]
          if not selected:
              raise SystemExit("no implemented analysis stages were selected")

          strict = os.environ.get("AUDIT_STRICT", "false").lower() in {"1", "true", "yes"}
          print(f"configured repository: {UPSTREAM_REPOSITORY}")
          print(f"configured assets: {', '.join(sorted(configured_assets))}")
          print(f"requested stages: {', '.join(requested_stages)}")
          print(f"analysis stages: {', '.join(selected)}")
          print(f"strict analyzer failures: {strict}")

          orchestrator = PipelineOrchestrator(logger=print, strict=strict)
          report = asyncio.run(orchestrator.run_selected(selected))

          source_json = report.output_dir / "audit-report.json"
          source_md = report.output_dir / "audit-report.md"
          if not source_json.is_file():
              raise SystemExit(f"analysis completed without report JSON: {source_json}")

          payload = json.loads(source_json.read_text(encoding="utf-8"))
          findings = payload.get("findings", [])
          if not isinstance(findings, list):
              raise SystemExit("analysis report findings must be a list")

          (out / "findings.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          if source_md.is_file():
              shutil.copy2(source_md, out / "audit-report.md")

          def normalize_root(value):
              return re.sub(r"[^a-z0-9]+", "_", str(value).lower()).strip("_")

          severity_rank = {"info": 0, "low": 1, "medium": 2, "high": 3, "critical": 4}
          known = load_known_issues()
          escaped = []
          suppressed = []
          informational = []
          rejected = []
          new = []

          for finding in findings:
              status = str(finding.get("status", "open")).lower()
              severity = str(finding.get("severity", "")).lower()
              asset = str(finding.get("asset", ""))
              root = normalize_root(finding.get("root_cause", ""))

              if status == "suppressed":
                  suppressed.append(finding)
                  continue
              if status == "false_positive":
                  rejected.append(finding)
                  continue

              candidates = [
                  issue
                  for issue in known
                  if asset in issue.asset and root == normalize_root(issue.root_cause)
              ]
              if candidates:
                  issue = candidates[0]
                  enriched = dict(finding)
                  enriched["matched_known_id"] = issue.id
                  enriched["known_severity"] = issue.severity
                  if severity_rank.get(severity, -1) > severity_rank.get(issue.severity.lower(), -1):
                      enriched["escape_reason"] = "severity_escalation"
                  else:
                      enriched["escape_reason"] = "known_root_cause_variant_not_suppressed"
                  escaped.append(enriched)
              elif severity == "info":
                  informational.append(finding)
              else:
                  new.append(finding)

          buckets = {
              "findings_new.json": new,
              "findings_escaped.json": escaped,
              "findings_suppressed.json": suppressed,
              "findings_informational.json": informational,
              "findings_rejected.json": rejected,
          }
          for name, items in buckets.items():
              (out / name).write_text(
                  json.dumps({"findings": items}, indent=2, sort_keys=True), encoding="utf-8"
              )

          generated_submissions = report.output_dir / "findings"
          if generated_submissions.is_dir():
              submissions = out / "submissions"
              submissions.mkdir(parents=True, exist_ok=True)
              for index, finding in enumerate(findings, start=1):
                  if str(finding.get("status", "open")).lower() != "open":
                      continue
                  matches = list(generated_submissions.glob(f"{index:03d}-*.md"))
                  if len(matches) == 1 and finding.get("id"):
                      shutil.copy2(matches[0], submissions / f"{finding['id']}.md")

          print(f"normalized report output: {out}")
          print(f"finding count: {len(findings)}")
          print(
              "finding buckets: "
              f"new={len(new)} escaped={len(escaped)} suppressed={len(suppressed)} "
              f"informational={len(informational)} rejected={len(rejected)}"
          )
          PY

      - name: Generate offline PoCs
        if: success()
        run: bash .github/scripts/generate-pocs.sh

      - name: Stage output
        if: always()
        run: bash .github/scripts/stage-output.sh

      - name: Validate staged submission format
        if: success()
        env:
          OUT_DIR: ${{ github.workspace }}/staging
        run: bash .github/scripts/verify-submissions.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ens-audit-submissions-${{ github.run_id }}
          path: |
            staging/INDEX.md
            staging/README.md
            staging/findings/
            staging/runs/
            staging/MANIFEST.json
            staging/SUBMISSION-CHECKLIST.md
            staging/submissions/
            staging/pocs/
            staging/insights/
          if-no-files-found: error
          retention-days: 14

      - name: Publish reports branch
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMPDIR="$(mktemp -d)"
          REPORT_TREE="$TMPDIR/reports-worktree"
          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git fetch origin reports:refs/remotes/origin/reports
            git worktree add -B reports "$REPORT_TREE" refs/remotes/origin/reports
          else
            git worktree add -B reports "$REPORT_TREE" HEAD
          fi

          DEST="$REPORT_TREE/reports/run-${RUN_ID}"
          mkdir -p "$DEST"
          cp -a "$GITHUB_WORKSPACE/staging/." "$DEST/"

          export DEST
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dest = Path(os.environ["DEST"])
          repo = os.environ["REPO"]
          run_id = os.environ["RUN_ID"]
          raw = f"https://raw.githubusercontent.com/{repo}/reports/reports/run-{run_id}"

          lines = [
              "# Export",
              "",
              f"- INDEX.md: {raw}/INDEX.md",
              f"- MANIFEST.json: {raw}/MANIFEST.json",
              f"- SUBMISSION-CHECKLIST.md: {raw}/SUBMISSION-CHECKLIST.md",
              f"- findings/findings_escaped.json: {raw}/findings/findings_escaped.json",
              f"- submissions/ directory: {raw}/submissions/",
              f"- pocs/ directory: {raw}/pocs/",
              f"- insights/ directory: {raw}/insights/",
              "",
              "## Non-duplicate findings",
              "",
          ]

          def load(name):
              path = dest / "findings" / name
              if not path.is_file():
                  return []
              data = json.loads(path.read_text(encoding="utf-8"))
              items = data if isinstance(data, list) else data.get("findings", [])
              return items if isinstance(items, list) else []

          seen = set()
          for bucket_name in ("findings_new.json", "findings_escaped.json"):
              for finding in load(bucket_name):
                  status = str(finding.get("status", "open")).lower()
                  if status in {"suppressed", "false_positive", "duplicate"} or finding.get("duplicate") is True:
                      continue
                  fid = str(
                      finding.get("id") or finding.get("finding_id") or finding.get("rule_id") or "unknown"
                  )
                  if fid in seen:
                      continue
                  seen.add(fid)
                  severity = finding.get("severity", "?")
                  asset = finding.get("asset", "?")
                  submission = dest / "submissions" / f"{fid}.md"
                  url = (
                      f"{raw}/submissions/{fid}.md"
                      if submission.is_file()
                      else f"{raw}/findings/{bucket_name}"
                  )
                  lines.append(f"- {fid} | {severity} | {asset} | {url}")

          (dest / "EXPORT.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          git -C "$REPORT_TREE" add reports/
          if git -C "$REPORT_TREE" diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git -C "$REPORT_TREE" commit -m "reports: publish run ${RUN_ID}"
            git -C "$REPORT_TREE" push origin reports
          fi
          echo "EXPORT=https://raw.githubusercontent.com/${REPO}/reports/reports/run-${RUN_ID}/EXPORT.md"
