name: ENS Submission Analysis

on:
  push:
    branches: [main]
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/analysis.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository URL to analyze'
        required: true
        default: 'https://github.com/immunefi-team/audit-comp-ens.git'
      assets:
        description: 'Configured audit assets'
        required: true
        default: 'manager,portal,workers,transaction-manager,smart-account'
      stages:
        description: 'Requested stages; unavailable optional stages are reported and skipped'
        required: true
        default: 'sast,symbolic,fuzz,deps,secrets,ui,rpc,diff,known-filter,report'

permissions:
  contents: read

concurrency:
  group: ens-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  QT_QPA_PLATFORM: offscreen

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ens-audit-runner/requirements.txt

      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install runner
        working-directory: ens-audit-runner
        run: python -m pip install -e '.[dev]'

      - name: Prepare output
        run: mkdir -p "$GITHUB_WORKSPACE/out/runs"

      - name: Run analysis
        env:
          TARGET_REPO: ${{ github.event.inputs.repo || 'https://github.com/immunefi-team/audit-comp-ens.git' }}
          TARGET_ASSETS: ${{ github.event.inputs.assets || 'manager,portal,workers,transaction-manager,smart-account' }}
          TARGET_STAGES: ${{ github.event.inputs.stages || 'sast,symbolic,fuzz,deps,secrets,ui,rpc,diff,known-filter,report' }}
        working-directory: ens-audit-runner
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/out/runs/analysis.log"
          import asyncio
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          from ens_audit.config import ASSETS, UPSTREAM_REPOSITORY
          from ens_audit.known_issues import load_known_issues
          from ens_audit.pipeline.orchestrator import PipelineOrchestrator

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          out = workspace / "out"
          out.mkdir(parents=True, exist_ok=True)

          requested_repo = os.environ["TARGET_REPO"].strip()
          if requested_repo != UPSTREAM_REPOSITORY:
              raise SystemExit(
                  f"workflow repo mismatch: requested={requested_repo!r} configured={UPSTREAM_REPOSITORY!r}"
              )

          aliases = {"portal": "explorer"}
          requested_assets = {
              aliases.get(value.strip(), value.strip())
              for value in os.environ["TARGET_ASSETS"].split(",")
              if value.strip()
          }
          configured_assets = {spec.name for spec in ASSETS}
          if requested_assets != configured_assets:
              raise SystemExit(
                  "current runner executes its fixed configured asset set; "
                  f"requested={sorted(requested_assets)} configured={sorted(configured_assets)}"
              )

          requested_stages = [
              value.strip().lower().replace("-", "_")
              for value in os.environ["TARGET_STAGES"].split(",")
              if value.strip()
          ]
          available = set(PipelineOrchestrator.ANALYSIS_STAGES) | {"known_filter", "report"}
          unavailable = [stage for stage in requested_stages if stage not in available]
          for stage in unavailable:
              print(f"::warning::stage '{stage}' is not implemented by the current runner; skipping")

          selected = [
              stage for stage in PipelineOrchestrator.ANALYSIS_STAGES if stage in requested_stages
          ]
          if not selected:
              raise SystemExit("no implemented analysis stages were selected")

          print(f"configured repository: {UPSTREAM_REPOSITORY}")
          print(f"configured assets: {', '.join(sorted(configured_assets))}")
          print(f"analysis stages: {', '.join(selected)}")

          orchestrator = PipelineOrchestrator(logger=print)
          report = asyncio.run(orchestrator.run_selected(selected))

          source_json = report.output_dir / "audit-report.json"
          source_md = report.output_dir / "audit-report.md"
          if not source_json.is_file():
              raise SystemExit(f"analysis completed without report JSON: {source_json}")

          payload = json.loads(source_json.read_text(encoding="utf-8"))
          findings = payload.get("findings", [])
          if not isinstance(findings, list):
              raise SystemExit("analysis report findings must be a list")

          (out / "findings.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
          )
          if source_md.is_file():
              shutil.copy2(source_md, out / "audit-report.md")

          def normalize_root(value):
              return re.sub(r"[^a-z0-9]+", "_", str(value).lower()).strip("_")

          severity_rank = {"info": 0, "low": 1, "medium": 2, "high": 3, "critical": 4}
          known = load_known_issues()
          escaped = []
          suppressed = []
          informational = []
          rejected = []
          new = []

          for finding in findings:
              status = str(finding.get("status", "open")).lower()
              severity = str(finding.get("severity", "")).lower()
              asset = str(finding.get("asset", ""))
              root = normalize_root(finding.get("root_cause", ""))

              if status == "suppressed":
                  suppressed.append(finding)
                  continue
              if status == "false_positive":
                  rejected.append(finding)
                  continue

              candidates = [
                  issue
                  for issue in known
                  if asset in issue.asset and root == normalize_root(issue.root_cause)
              ]
              if candidates:
                  issue = candidates[0]
                  enriched = dict(finding)
                  enriched["matched_known_id"] = issue.id
                  enriched["known_severity"] = issue.severity
                  if severity_rank.get(severity, -1) > severity_rank.get(issue.severity.lower(), -1):
                      enriched["escape_reason"] = "severity_escalation"
                  else:
                      enriched["escape_reason"] = "known_root_cause_variant_not_suppressed"
                  escaped.append(enriched)
              elif severity == "info":
                  informational.append(finding)
              else:
                  new.append(finding)

          buckets = {
              "findings_new.json": new,
              "findings_escaped.json": escaped,
              "findings_suppressed.json": suppressed,
              "findings_informational.json": informational,
              "findings_rejected.json": rejected,
          }
          for name, items in buckets.items():
              (out / name).write_text(
                  json.dumps({"findings": items}, indent=2, sort_keys=True), encoding="utf-8"
              )

          generated_submissions = report.output_dir / "findings"
          if generated_submissions.is_dir():
              submissions = out / "submissions"
              submissions.mkdir(parents=True, exist_ok=True)
              for index, finding in enumerate(findings, start=1):
                  if str(finding.get("status", "open")).lower() != "open":
                      continue
                  matches = list(generated_submissions.glob(f"{index:03d}-*.md"))
                  if len(matches) == 1 and finding.get("id"):
                      shutil.copy2(matches[0], submissions / f"{finding['id']}.md")

          print(f"normalized report output: {out}")
          print(f"finding count: {len(findings)}")
          print(
              "finding buckets: "
              f"new={len(new)} escaped={len(escaped)} suppressed={len(suppressed)} "
              f"informational={len(informational)} rejected={len(rejected)}"
          )
          PY

      - name: Verify submission artifacts
        if: always()
        run: bash .github/scripts/verify-submissions.sh

      - name: Stage output
        if: always()
        run: bash .github/scripts/stage-output.sh

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ens-audit-submissions-${{ github.run_id }}
          path: |
            staging/README.md
            staging/findings/
            staging/runs/
            staging/MANIFEST.json
            staging/SUBMISSION-CHECKLIST.md
            staging/submissions/
            staging/pocs/
            staging/insights/
          if-no-files-found: error
          retention-days: 14
