name: Worker Emulator Verification

on:
  push:
    branches: [main]
    paths:
      - 'tooling/worker-emulator/**'
      - 'tooling/pnpm-workspace.yaml'
      - 'tooling/package.json'
      - '.github/workflows/worker-emulator.yml'
  pull_request:
    paths:
      - 'tooling/worker-emulator/**'
      - 'tooling/pnpm-workspace.yaml'
      - 'tooling/package.json'
      - '.github/workflows/worker-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install tooling dependencies
        run: pnpm --dir tooling install --frozen-lockfile=false

      - name: Run Worker emulator self-test
        run: pnpm --dir tooling --filter @workspace/worker-emulator test
