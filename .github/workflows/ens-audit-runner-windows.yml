name: ENS Audit Runner Windows

on:
  push:
    branches: [main]
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/ens-audit-runner-windows.yml'
  pull_request:
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/ens-audit-runner-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ens-audit-runner-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ens-audit-runner
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ens-audit-runner/requirements.txt

      - name: Install package and build dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run Windows test suite
        run: pytest -q --strict-markers

      - name: Validate packaged resources
        shell: pwsh
        run: |
          python -c "from ens_audit.known_issues import load_known_issues; assert len(load_known_issues()) >= 60"
          python -c "from importlib import resources; p=resources.files('ens_audit').joinpath('rules/codeql-config.yml'); assert p.is_file()"

      - name: Build one-file GUI executable
        run: pyinstaller --clean --noconfirm ens-audit-runner.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/ENSAuditRunner.exe')) {
            throw 'dist/ENSAuditRunner.exe was not produced'
          }
          Get-Item 'dist/ENSAuditRunner.exe' | Format-List Name,Length,LastWriteTime

      - name: Offscreen executable startup smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath '.\dist\ENSAuditRunner.exe' -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "ENSAuditRunner.exe exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: ENSAuditRunner-windows-${{ github.run_id }}
          path: ens-audit-runner/dist/ENSAuditRunner.exe
          if-no-files-found: error
          retention-days: 14
