name: ENS Audit Runner CI

on:
  push:
    branches: [main]
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/ens-audit-runner-ci.yml'
  pull_request:
    paths:
      - 'ens-audit-runner/**'
      - '.github/workflows/ens-audit-runner-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ens-audit-runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: ens-audit-runner
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ens-audit-runner/requirements.txt

      - name: Install Qt runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Strict mypy
        run: mypy --strict src/ens_audit

      - name: Bandit high-severity gate
        run: bandit -r src/ -ll

      - name: Repository unsafe-call gates
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.py' 'shell[[:space:]]*=[[:space:]]*True' src tests
          ! grep -R --line-number --include='*.py' -E '(^|[^[:alnum:]_])eval[[:space:]]*\(' src tests
          ! grep -R --line-number --include='*.py' -E 'pickle\.load[s]?[[:space:]]*\(' src tests

      - name: Pytest with coverage
        run: pytest -q --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit
        run: pip-audit
