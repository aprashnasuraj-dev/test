- id: "R2-01"
  severity: "Medium"
  asset: ["manager", "explorer"]
  title: "Secrets remediation incomplete: .env files still tracked, provider keys unrotated"
  root_cause: "committed_credentials"
  match_patterns:
    - file_glob: "**/.env*"
    - rule_id: "trufflehog:*"
    - rule_id: "detect-secrets:*"
  suppress_if: ["provider_key_rotated_after:2026-08-10"]
  notes: "Client-side VITE_* are public identifiers; blast radius and key hygiene are the known issue."

- id: "R2-02"
  severity: "Medium"
  asset: ["manager"]
  title: "No Content-Security-Policy or security headers"
  root_cause: "missing_security_headers"
  match_patterns:
    - content_regex: "(?i)content-security-policy|x-frame-options|referrer-policy|x-content-type-options"
  notes: "An actual injection sink is a separate finding."

- id: "SEC-MGR-003"
  severity: "High"
  asset: ["manager"]
  title: "API base-URL override can send bearer token to an arbitrary host"
  root_cause: "bearer_token_cross_origin"
  match_patterns:
    - rule_id: "ens-bearer-configurable-base-url"
    - content_regex: "(?i)bearer.*base.?url|authorization.*arbitrary host"
  notes: "Persisted API base URL can redirect authenticated requests to another host."

- id: "SEC-MGR-008/011"
  severity: "High"
  asset: ["manager"]
  title: "Debug routes and router devtools ship to production"
  root_cause: "production_debug_surface"
  match_patterns:
    - content_regex: "(?i)debug route|router devtools|localhost.*siwe"
  notes: "Debug route group, localhost SIWE flow, and router devtools share one fix."

- id: "SEC-MGR-010"
  severity: "Low"
  asset: ["manager"]
  title: "Avatar-upload EIP-712 domain omits chainId and verifyingContract"
  root_cause: "underspecified_eip712_domain"
  match_patterns:
    - rule_id: "ens-eip712-domain-missing-binding"
    - content_regex: "(?i)eip.?712.*chainid|verifyingcontract"
  notes: "Practical cross-context replay was not confirmed in the disclosed issue."

- id: "EXP-INPUT-003"
  severity: "Medium"
  asset: ["manager"]
  title: "Persisted store state is parsed without validating value shapes"
  root_cause: "unvalidated_persisted_state"
  match_patterns:
    - rule_id: "ens-json-parse-without-schema"
    - content_regex: '(?i)json\.parse.*schema|persisted.*state.*validat'
  notes: "Unexpected locally-writable value types can reach code that assumes validated shapes."

- id: "EXP-INPUT-008"
  severity: "Low"
  asset: ["manager"]
  title: "Avatar uploads retain EXIF metadata, including GPS"
  root_cause: "image_metadata_not_stripped"
  match_patterns:
    - content_regex: "(?i)exif|gps.*avatar|avatar.*metadata"
  notes: "Browser-reported MIME type is also relied upon."

- id: "EXP-INPUT-009"
  severity: "Low"
  asset: ["manager"]
  title: "Push notification click opens a backend-supplied URL unvalidated"
  root_cause: "unvalidated_navigation_url"
  match_patterns:
    - rule_id: "ens-unvalidated-open-url"
    - content_regex: "(?i)notification.*open.*url|openwindow.*unvalidated"
  notes: "Requires control of or injection into the notification payload."

- id: "EXP-INPUT-005"
  severity: "Medium"
  asset: ["manager", "explorer"]
  title: "ENS name validators accept homoglyphs, bidi and control characters"
  root_cause: "insufficient_ens_name_normalization"
  match_patterns:
    - content_regex: "(?i)homoglyph|bidirectional|bidi|control character|leading.*dot|trailing.*dot"
  notes: "Known impact is display confusion rather than incorrect resolution."

- id: "EXP-4337-002"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Transports do not validate chainId; silent fallback to Sepolia"
  root_cause: "chain_id_not_bound_to_wallet"
  match_patterns:
    - rule_id: "ens-chainid-not-validated"
    - content_regex: "(?i)chainid.*not.*validat|fallback.*sepolia"
  notes: "Request chainId is not compared against the connected wallet chain."

- id: "EXP-4337-003"
  severity: "High"
  asset: ["transaction-manager"]
  title: "request.from is not checked against the connected signer"
  root_cause: "request_from_not_bound_to_signer"
  match_patterns:
    - rule_id: "ens-request-from-not-validated"
    - content_regex: '(?i)request\.from.*signer|from.*connected account'
  notes: "Most wallets reject a mismatch, so exploitability depends on the wallet."

- id: "SEC-TXM-002"
  severity: "High"
  asset: ["smart-account"]
  title: "Cached smart-account address is used without matching the live SDK address"
  root_cause: "cached_address_not_cross_checked"
  match_patterns:
    - content_regex: "(?i)cached.*smart.?account.*address|sdk.*derived.*address"
  notes: "The missing live-address cross-check is confirmed; a concrete attack path was not."

- id: "R2-03"
  severity: "Medium"
  asset: ["smart-account"]
  title: "Session key is an unscoped full account owner for 7 days"
  root_cause: "unscoped_session_owner"
  match_patterns:
    - rule_id: "ens-unscoped-session-authority"
    - content_regex: "(?i)session key.*owner|co-owner.*7 day|unscoped.*session"
  notes: "Broad authority and browser-storage exposure within the stated lifetime are accepted design residuals."

- id: "R2-06"
  severity: "Low"
  asset: ["smart-account"]
  title: "Session revocation is local-only; no on-chain revoke exists"
  root_cause: "local_only_session_revocation"
  match_patterns:
    - rule_id: "ens-local-revoke-without-chain-revoke"
    - content_regex: "(?i)revok.*localstorage|local-only.*revok|no on-chain revok"
  notes: "The co-owner permission persists until expiry after local storage is cleared."

- id: "EXP-GAP-006"
  severity: "Medium"
  asset: ["manager", "explorer", "workers", "transaction-manager", "smart-account"]
  title: "Telemetry forwards full transaction context to a third party"
  root_cause: "excessive_telemetry_payload"
  match_patterns:
    - content_regex: "(?i)telemetry.*calldata|analytics.*wallet address|full transaction context"
  notes: "Known issue is privacy and data minimization with a third-party processor."

- id: "R2-04"
  severity: "Low"
  asset: ["explorer"]
  title: "OG-image worker fetches an attacker-controlled avatar URL"
  root_cause: "server_side_fetch_of_untrusted_avatar_url"
  match_patterns:
    - rule_id: "ens-ssrf-untrusted-url"
    - content_regex: "(?i)og.?image.*avatar.*fetch|attacker-controlled.*avatar.*url"
  notes: "Known limited SSRF primitive in the Explorer OG-image worker."

- id: "R2-05"
  severity: "Low"
  asset: ["workers"]
  title: "SendGrid event webhook fails open when the verification key is unset"
  root_cause: "webhook_signature_fail_open"
  match_patterns:
    - rule_id: "ens-webhook-fail-open"
    - content_regex: "(?i)sendgrid.*verification key.*unset|webhook.*fail.?open"
  notes: "Unauthenticated bodies are processed when the verification key is absent."

- id: "R3-01"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Telemetry trimming loop cannot terminate and freezes the tab"
  root_cause: "nonterminating_telemetry_trim_loop"
  match_patterns:
    - rule_id: "ens-telemetry-trim-nontermination"
    - content_regex: "(?i)telemetry.*trim.*loop|event list.*never.*shrink"
  notes: "At two oversized events the loop rebuilds the same list and never exits."

- id: "R3-02"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Awaiting a stopped transaction actor never settles"
  root_cause: "xstate_subscription_missing_completion"
  match_patterns:
    - rule_id: "ens-xstate-missing-complete"
    - content_regex: "(?i)subscribe.*onnext.*no.*complete|stopped.*actor.*never.*settle"
  notes: "Multiple individual sites share this root cause and are duplicates of R3-02."

- id: "R3-03"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Registration machine strands when a polled actor is stopped"
  root_cause: "registration_poller_missing_completion"
  match_patterns:
    - rule_id: "ens-registration-poller-stall"
    - content_regex: "(?i)registration.*poll.*actor.*stopp|permanent spinner"
  notes: "Stopped actor leaves the registration waiting state with no timeout or exit."

- id: "R3-04"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Commitment retry resumes at the wrong step and loops on an error"
  root_cause: "retry_resumes_without_regenerating_commitment"
  match_patterns:
    - rule_id: "ens-commitment-retry-wrong-step"
    - content_regex: "(?i)commitment.*retry.*submission|undefined.*commitment.*retry"
  notes: "Retry submits an undefined commitment and routes back into the same failure path."

- id: "R3-05"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Clearing active transactions also deletes the archived history"
  root_cause: "localstorage_prefix_collision"
  match_patterns:
    - rule_id: "ens-transaction-history-prefix-collision"
    - content_regex: "(?i)active transaction.*history.*prefix|clear.*transaction.*archive"
  notes: "The active-record key scan also matches the history key."

- id: "R3-06"
  severity: "High"
  asset: ["transaction-manager"]
  title: "Archived transactions drop chainId, so history reporting discards them"
  root_cause: "archive_chain_id_not_preserved"
  match_patterns:
    - rule_id: "ens-archive-chainid-loss"
    - content_regex: "(?i)archive.*chainid.*drop|history.*without.*chain"
  notes: "Archive code omits fallback to the chain id already present on the request."

- id: "R3-07"
  severity: "Medium"
  asset: ["transaction-manager"]
  title: "A reused transaction id skips archiving, history and telemetry"
  root_cause: "transaction_completion_id_never_cleared"
  match_patterns:
    - rule_id: "ens-reused-transaction-id"
    - content_regex: "(?i)reused transaction id|already completed.*archiv|fixed id.*telemetry"
  notes: "Completion tracking is retained per id across retries."

- id: "R3-08"
  severity: "Medium"
  asset: ["transaction-manager"]
  title: "A stale error is attached to a transaction that later succeeded"
  root_cause: "stale_error_not_cleared_on_success"
  match_patterns:
    - rule_id: "ens-stale-error-after-success"
    - content_regex: "(?i)stale error.*success|confirmed transaction.*error"
  notes: "The earlier failure message is retained after a later successful attempt."

- id: "QA-01"
  severity: "Functional"
  asset: ["manager", "explorer"]
  title: "Name transfers with certain role combinations break follow-up actions"
  root_cause: "post_transfer_role_combination_breakage"
  match_patterns:
    - content_regex: "(?i)transfer.*role.*profile|transfer.*role.*primary|after transfer.*profile|after transfer.*primary"
  notes: "Known functional breakage only; a role combination that grants unauthorized authority is a new security finding."

- id: "QA-02"
  severity: "Functional"
  asset: ["manager", "explorer"]
  title: "WalletConnect on mobile is broken or degraded"
  root_cause: "mobile_walletconnect_session_sync_failure"
  match_patterns:
    - content_regex: "(?i)walletconnect.*mobile.*reload|rainbow.*walletconnect.*fail|metamask.*reload.*connect"
  notes: "Known mobile connection/session-refresh defect."

- id: "QA-03"
  severity: "Functional"
  asset: ["explorer"]
  title: "Minor price mismatch in registration and extension modals"
  root_cause: "displayed_registration_price_rounding_mismatch"
  match_patterns:
    - content_regex: "(?i)discount.*per.?year.*total|registration.*price.*mismatch|extension.*price.*mismatch"
  notes: "Display-only mismatch is known; a mismatch with the amount actually charged on-chain is new."

- id: "QA-04"
  severity: "Functional"
  asset: ["explorer"]
  title: "Burning fuses on wrapped V1 names throws a transaction error"
  root_cause: "wrapped_v1_fuse_burn_failure"
  match_patterns:
    - content_regex: "(?i)wrapped v1.*burn.*fuse|burn.*fuse.*transaction error"
  notes: "Known wrapped V1 fuse-burning failure; overlaps WEB-1259."

- id: "QA-05"
  severity: "Functional"
  asset: ["manager"]
  title: "Renewal is blocked immediately after registration"
  root_cause: "post_registration_renewal_temporarily_blocked"
  match_patterns:
    - content_regex: "(?i)renew.*immediately.*register|name cannot be renewed here.*register"
  notes: "The block is known to clear after some time."

- id: "QA-06"
  severity: "Functional"
  asset: ["manager", "explorer"]
  title: "A deleted, non-resolving subname is still shown as the primary name"
  root_cause: "stale_primary_name_after_subname_deletion"
  match_patterns:
    - content_regex: "(?i)deleted.*subname.*primary|non-resolving.*primary.*profile"
  notes: "Known stale display/profile error after a primary subname stops resolving."

- id: "QA-07"
  severity: "Functional"
  asset: ["explorer"]
  title: "Rejecting a transaction shows a bulky error and re-prompts the wallet"
  root_cause: "cancelled_transaction_reprompt_loop"
  match_patterns:
    - content_regex: "(?i)reject.*transaction.*prompt again|cancel.*transaction.*re.?prompt|bulky.*raw error.*wallet"
  notes: "Known cancellation UX defect; overlaps WEB-580."

- id: "QA-08"
  severity: "Functional"
  asset: ["manager", "explorer"]
  title: "Long error messages overflow their containers"
  root_cause: "unbounded_error_text_layout"
  match_patterns:
    - content_regex: "(?i)long error.*overflow|raw error.*container|error message.*spill"
  notes: "Raw error presentation is known; exposure of secrets or tokens in an error is a new security finding."

- id: "QA-09"
  severity: "Functional"
  asset: ["manager"]
  title: "Avatar missing from homepage search results"
  root_cause: "homepage_search_avatar_not_rendered"
  match_patterns:
